spring.application.name=transit
spring.datasource.url=jdbc:postgresql://localhost:5432/transit_db
spring.datasource.username=admin
spring.datasource.password=secret
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.flyway.enabled=false

transit.gtfs.url=https://api.open-data.cui.wroclaw.pl/od2/6/
transit.gtfs.import-on-startup=true
transit.gtfs.user-agent=TransitPWR/0.1 (+https://github.com/NeoNeq5)
